name: Chrome Web Store

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Read extension version
        id: version
        run: echo "value=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: |
          node tests/test-calculator.js
          node tests/test-parser.js
          node tests/test-package-extension.js

      - name: Package extension
        run: |
          python3 scripts/package_extension.py \
            --source . \
            --output dist/il-tax-calculator-etrade-${{ steps.version.outputs.value }}.zip

      - name: Upload packaged extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension-${{ steps.version.outputs.value }}
          path: dist/il-tax-calculator-etrade-${{ steps.version.outputs.value }}.zip

      - name: Publish to Chrome Web Store
        uses: fregante/chrome-webstore-action@v2
        with:
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          zip-path: dist/il-tax-calculator-etrade-${{ steps.version.outputs.value }}.zip
