name: Chrome Web Store

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-and-publish:
    runs-on: ubuntu-latest
    env:
      CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
      CHROME_WEBSTORE_PUBLISHER_ID: ${{ secrets.CHROME_WEBSTORE_PUBLISHER_ID }}
      HAS_SERVICE_ACCOUNT: ${{ secrets.CHROME_WEBSTORE_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Read extension version
        id: version
        run: echo "value=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: |
          node tests/test-calculator.js
          node tests/test-parser.js
          node tests/test-package-extension.js

      - name: Package extension
        run: |
          python3 scripts/package_extension.py \
            --source . \
            --output dist/il-tax-calculator-etrade-${{ steps.version.outputs.value }}.zip

      - name: Upload packaged extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension-${{ steps.version.outputs.value }}
          path: dist/il-tax-calculator-etrade-${{ steps.version.outputs.value }}.zip

      - name: Authenticate to Google Cloud
        if: env.CHROME_EXTENSION_ID != '' && env.CHROME_WEBSTORE_PUBLISHER_ID != '' && env.HAS_SERVICE_ACCOUNT == 'true'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.CHROME_WEBSTORE_SERVICE_ACCOUNT_JSON }}
          create_credentials_file: true

      - name: Set up gcloud
        if: env.CHROME_EXTENSION_ID != '' && env.CHROME_WEBSTORE_PUBLISHER_ID != '' && env.HAS_SERVICE_ACCOUNT == 'true'
        uses: google-github-actions/setup-gcloud@v3

      - name: Upload and publish to Chrome Web Store
        if: env.CHROME_EXTENSION_ID != '' && env.CHROME_WEBSTORE_PUBLISHER_ID != '' && env.HAS_SERVICE_ACCOUNT == 'true'
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          ACCESS_TOKEN="$(gcloud auth print-access-token --scopes=https://www.googleapis.com/auth/chromewebstore)"
          PACKAGE="dist/il-tax-calculator-etrade-${VERSION}.zip"

          curl --fail --show-error --silent \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -X POST \
            -T "${PACKAGE}" \
            "https://chromewebstore.googleapis.com/upload/v2/publishers/${CHROME_WEBSTORE_PUBLISHER_ID}/items/${CHROME_EXTENSION_ID}:upload"

          curl --fail --show-error --silent \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -X POST \
            "https://chromewebstore.googleapis.com/v2/publishers/${CHROME_WEBSTORE_PUBLISHER_ID}/items/${CHROME_EXTENSION_ID}:publish"

      - name: Explain skipped publish
        if: env.CHROME_EXTENSION_ID == '' || env.CHROME_WEBSTORE_PUBLISHER_ID == '' || env.HAS_SERVICE_ACCOUNT != 'true'
        run: |
          echo "Chrome Web Store publish skipped."
          echo "Set CHROME_EXTENSION_ID, CHROME_WEBSTORE_PUBLISHER_ID, and CHROME_WEBSTORE_SERVICE_ACCOUNT_JSON secrets to enable automated publishing."
