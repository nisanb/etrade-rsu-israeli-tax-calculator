name: Chrome Web Store

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Read extension version
        id: version
        run: echo "value=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: npm ci && npm test

      - name: Package extension
        run: |
          python3 scripts/package_extension.py \
            --source . \
            --output dist/il-tax-calculator-etrade-${{ steps.version.outputs.value }}.zip

      - name: Upload packaged extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension-${{ steps.version.outputs.value }}
          path: dist/il-tax-calculator-etrade-${{ steps.version.outputs.value }}.zip

      - name: Check if version is new
        id: publish_check
        env:
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
        run: |
          TOKEN=$(curl -s -X POST https://oauth2.googleapis.com/token \
            -d "client_id=${CLIENT_ID}&client_secret=${CLIENT_SECRET}&refresh_token=${REFRESH_TOKEN}&grant_type=refresh_token" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")

          # v1.1 'get item' returns crxVersion; equivalent v2 endpoint can also work
          PUBLISHED=$(curl -s -H "Authorization: Bearer $TOKEN" \
            "https://www.googleapis.com/chromewebstore/v1.1/items/${EXTENSION_ID}?projection=DRAFT" \
            | python3 -c "
          try:
              import sys,json
              d = json.load(sys.stdin)
              print(d.get('crxVersion', ''))
          except Exception:
              print('')" 2>/dev/null)

          CURRENT="${{ steps.version.outputs.value }}"

          if [ -n "$PUBLISHED" ] && [ "$PUBLISHED" = "$CURRENT" ]; then
            echo "Version $CURRENT already published. Skipping publish step."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Will publish: manifest=$CURRENT, store=${PUBLISHED:-unknown}"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to Chrome Web Store
        if: steps.publish_check.outputs.skip != 'true'
        env:
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
        run: |
          SOURCE="dist/il-tax-calculator-etrade-${{ steps.version.outputs.value }}.zip"

          # First attempt
          set +e
          npx chrome-webstore-upload-cli \
            --source "$SOURCE" \
            --extension-id "$EXTENSION_ID" \
            --publisher-id "$PUBLISHER_ID" 2>&1 | tee /tmp/publish_out.txt
          PUBLISH_EXIT=${PIPESTATUS[0]}
          set -e

          if [ $PUBLISH_EXIT -eq 0 ]; then
            exit 0
          fi

          # If a prior version is in review, cancel it via the Chrome Web Store
          # V2 API (publishers.items.cancelSubmission — introduced Oct 2025)
          # then retry. Limit: 6 cancellations per publisher per day.
          if grep -qi "in review" /tmp/publish_out.txt; then
            echo "Item is in review — canceling via Chrome Web Store V2 API..."

            TOKEN=$(curl -s -X POST https://oauth2.googleapis.com/token \
              -d "client_id=${CLIENT_ID}&client_secret=${CLIENT_SECRET}&refresh_token=${REFRESH_TOKEN}&grant_type=refresh_token" \
              | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")

            curl -s -f \
              -H "Authorization: Bearer $TOKEN" \
              -X POST \
              "https://chromewebstore.googleapis.com/v2/publishers/${PUBLISHER_ID}/items/${EXTENSION_ID}:cancelSubmission"

            echo "Submission canceled — waiting 15s for store to process..."
            sleep 15

            echo "Retrying publish..."
            npx chrome-webstore-upload-cli \
              --source "$SOURCE" \
              --extension-id "$EXTENSION_ID" \
              --publisher-id "$PUBLISHER_ID"
          else
            echo "Publish failed:"
            cat /tmp/publish_out.txt
            exit 1
          fi
