name: Chrome Web Store

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Read extension version
        id: version
        run: echo "value=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: |
          node tests/test-calculator.js
          node tests/test-parser.js
          node tests/test-package-extension.js

      - name: Package extension
        run: |
          python3 scripts/package_extension.py \
            --source . \
            --output dist/il-tax-calculator-etrade-${{ steps.version.outputs.value }}.zip

      - name: Upload packaged extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension-${{ steps.version.outputs.value }}
          path: dist/il-tax-calculator-etrade-${{ steps.version.outputs.value }}.zip

      - name: Publish to Chrome Web Store
        env:
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
        run: |
          SOURCE="dist/il-tax-calculator-etrade-${{ steps.version.outputs.value }}.zip"

          set +e
          npx chrome-webstore-upload-cli \
            --source "$SOURCE" \
            --extension-id "$EXTENSION_ID" \
            --publisher-id "$PUBLISHER_ID" 2>&1 | tee /tmp/publish_out.txt
          PUBLISH_EXIT=${PIPESTATUS[0]}
          set -e

          if [ $PUBLISH_EXIT -eq 0 ]; then
            exit 0
          fi

          # The Chrome Web Store API does not expose a cancel/revoke endpoint.
          # When a prior version is in review, skip publish gracefully so CI
          # stays green (tests passed, artifact uploaded). To unblock: open
          # https://chrome.google.com/webstore/devconsole, cancel the review
          # manually, then re-run this workflow via Actions → workflow_dispatch.
          if grep -qi "in review" /tmp/publish_out.txt; then
            echo "⚠️  Publish skipped: a prior version is currently in Google's review queue."
            echo "   To publish now: cancel the review in the Chrome Web Store Developer Console,"
            echo "   then re-run this workflow manually (Actions → Run workflow)."
            exit 0
          fi

          echo "Publish failed:"
          cat /tmp/publish_out.txt
          exit 1
